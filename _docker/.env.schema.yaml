envSchema:
  # ---------------------------------------------------------------------------
  # Common
  # ---------------------------------------------------------------------------
  - name: IMAGE_BASE_PATH
    label: Image Registry Base Path
    description: "Base path of the container registry from which all Gaeco service images are pulled."
    type: text
    required: true
    default: ghcr.io/gaeco-ekkodale

  - name: ASPNETCORE_ENVIRONMENT
    label: ASP.NET Core Environment
    description: "Runtime environment for the .NET backend (e.g. Development, Staging, Production)."
    type: text
    required: true
    default: Development

  - name: OTLP_ENDPOINT
    label: OpenTelemetry OTLP Endpoint
    description: "Endpoint where telemetry data is exported."
    type: text
    required: true
    default: http://gaeco-monitor-aspire:18889

  # ---------------------------------------------------------------------------
  # External Service Hostnames
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_SERVER_HOSTNAME
    label: Keycloak Server Hostname
    description: "Hostname (and optional port) used to reach the Keycloak server. The protocol (https://) is prepended by the compose file."
    type: text
    required: true

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_REALM
    label: Keycloak Realm
    description: "Keycloak realm used for authentication."
    type: text
    required: true
    default: gaeco

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  - name: KAFKA_ADDRESS
    label: Kafka Address
    description: "Kafka bootstrap server address (network alias on gaeco-network)."
    type: text
    required: true
    default: gaeco-broker:29092

  - name: KAFKA_TOPICS_GUIDELINES
    label: Kafka Topic (Guidelines)
    description: "Kafka topic for guideline upload events."
    type: text
    required: true
    default: ekkodale.gaeco.guideline.public.uploaded

  # ---------------------------------------------------------------------------
  # Minio (Object Storage)
  # ---------------------------------------------------------------------------
  - name: MINIO_ADDRESS
    label: Minio Address
    description: "Address of the Minio instance (network alias on gaeco-network, e.g. gaeco-minio:9000)."
    type: text
    required: true
    default: gaeco-minio:9000

  - name: MINIO_ROOT_USER
    label: Minio Root User
    description: "Root user / access key for Minio."
    type: text
    required: true
    default: minioadmin

  - name: MINIO_ROOT_PASSWORD
    label: Minio Root Password
    description: "Root password / secret key for Minio."
    type: password
    required: true

  # ---------------------------------------------------------------------------
  # Guideline Service
  # ---------------------------------------------------------------------------
  - name: GUIDELINE_SERVER_HOSTNAME
    label: Guideline Server Hostname
    description: "Hostname under which the Guideline Service server is reachable (used for Traefik routing)."
    type: text
    required: true

  - name: ALLOWED_CORS_ORIGIN
    label: Allowed CORS Origin
    description: "Origin URL allowed to make cross-origin requests to the Guideline Service API."
    type: text
    required: true

  - name: GUIDELINE_POSTGRES_USER
    label: Guideline Postgres User
    description: "Database user for the Guideline Service PostgreSQL instance."
    type: text
    required: true
    default: GuidelineService

  - name: GUIDELINE_POSTGRES_PASSWORD
    label: Guideline Postgres Password
    description: "Database password for the Guideline Service PostgreSQL instance."
    type: password
    required: true

  - name: GUIDELINE_POSTGRES_DATABASE
    label: Guideline Postgres Database
    description: "Database name for the Guideline Service PostgreSQL instance."
    type: text
    required: true
    default: GuidelineServiceDB
